<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IS Career Interview Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
            background-color: #19324F;
            color: #17212B;
        }

        .page-box {
            background-color: #F7F3EA;
            padding: 35px;
            border-radius: 16px;
        }

        .intro {
            text-align: center;
            margin-bottom: 35px;
        }

        .role-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
            margin-top: 30px;
        }

        .role-button {
            background-color: white;
            border: 2px solid #19324F;
            border-radius: 12px;
            padding: 25px 15px;
            font-size: 19px;
            font-weight: bold;
            cursor: pointer;
        }

        .role-button:hover {
            background-color: #E7B84B;
        }

        .section-title {
            margin-top: 45px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ccc;
        }

        .question-box {
            background-color: white;
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            min-height: 140px;
            font-size: 15px;
        }

        pre {
            background-color: #20252B;
            color: white;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            white-space: pre-wrap;
        }

        label {
            display: block;
            margin: 12px 0;
            cursor: pointer;
        }

        .submit-button,
        .restart-button {
            margin-top: 30px;
            padding: 14px 28px;
            background-color: #E7B84B;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .interview-buttons {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }

        .results-section {
            margin-top: 35px;
            padding: 25px;
            background-color: white;
            border-radius: 10px;
        }

        .feedback-item {
            margin-top: 20px;
            padding: 20px;
            background-color: #f5f5f5;
            border-radius: 8px;
        }

        .user-response {
            padding: 15px;
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .correct-answer {
            color: green;
            font-weight: bold;
        }

        .wrong-answer {
            color: red;
            font-weight: bold;
        }

        .feedback-placeholder {
            margin-top: 15px;
            padding: 15px;
            border: 1px dashed #999;
            border-radius: 8px;
        }

        #interviewArea,
        #resultsArea {
            display: none;
        }

        @media (max-width: 700px) {
            .role-grid {
                grid-template-columns: 1fr;
            }

            .interview-buttons {
                gap: 15px;
            }
        }
    </style>
</head>

<body>

<div class="page-box">

    <div id="roleSelection">
        <div class="intro">
            <h1>IS Mock Interview Practice</h1>
            <p>Choose a career path to begin a role-specific mock interview.</p>
        </div>

        <div class="role-grid">

            <button
                class="role-button"
                onclick="startInterview('dataAnalyst')">
                Data Analyst
            </button>

            <button
                class="role-button"
                onclick="startInterview('businessAnalyst')">
                Business Analyst
            </button>

            <button
                class="role-button"
                onclick="startInterview('softwareDeveloper')">
                Software Developer
            </button>

            <button
                class="role-button"
                onclick="startInterview('cybersecurityAnalyst')">
                Cybersecurity Analyst
            </button>

            <button
                class="role-button"
                onclick="startInterview('productManager')">
                Product Manager
            </button>

            <button
                class="role-button"
                onclick="startInterview('technologyConsultant')">
                Technology Consultant
            </button>

        </div>
    </div>


    <div id="interviewArea">

        <h1 id="roleTitle"></h1>

        <p>
            Complete all six questions. The first three are behavioral interview
            questions and the final three are based on a role-specific scenario.
        </p>

        <h2 class="section-title">
            Part 1 — Behavioral Interview
        </h2>

        <div id="behavioralContainer"></div>

        <h2 class="section-title">
            Part 2 — Role-Specific Interview
        </h2>

        <div id="technicalContainer"></div>


        <div class="interview-buttons">

            <button
                class="submit-button"
                onclick="goBackToRoles()">
                ← Back
            </button>

            <button
                class="submit-button"
                onclick="submitInterview()">
                Submit Interview
            </button>

        </div>


        <div id="errorMessage"></div>

    </div>


    <div id="resultsArea"></div>

</div>


<script>

const interviewBanks = {

    // =====================================================
    // DATA ANALYST
    // =====================================================

    dataAnalyst: {

        title: "Data Analyst",

        behavioral: [
            "Tell me about a project where you used data to answer a business question.",
            "Tell me about a time you found an error or inconsistency in data. What did you do?",
            "Describe a time you had to explain a data finding to someone without a technical background.",
            "Tell me about a time you worked with incomplete or messy data.",
            "Describe a time your analysis led you to a conclusion you did not originally expect.",
            "Tell me about a time you had to balance accuracy with a tight deadline."
        ],

        scenarios: [

            {
                title: "SQL Sales Analysis",

                prompt:
                    "A retailer stores each order in an orders table. Review the query below.",

                code: `
SELECT customer_id, SUM(amount) AS total_spent
FROM orders
GROUP BY customer_id
HAVING SUM(amount) > 1000;
                `,

                questions: [

                    {
                        question:
                            "What does this query return?",

                        options: [
                            "Every customer and every individual order",
                            "Customers whose total spending is greater than $1,000",
                            "Customers who placed exactly 1,000 orders",
                            "Only the single highest-spending customer"
                        ],

                        correct: 1,

                        explanation:
                            "GROUP BY creates one result per customer, SUM totals each customer's spending, and HAVING keeps only customers whose total exceeds 1,000."
                    },

                    {
                        question:
                            "Why is HAVING used instead of WHERE for the final condition?",

                        options: [
                            "HAVING filters results after aggregation",
                            "WHERE cannot be used with numbers",
                            "HAVING sorts the results",
                            "WHERE only works with customer names"
                        ],

                        correct: 0,

                        explanation:
                            "HAVING is commonly used to filter groups after aggregate calculations such as SUM."
                    },

                    {
                        question:
                            "Which SQL concept allows rows to be combined by customer_id?",

                        options: [
                            "ORDER BY",
                            "GROUP BY",
                            "DELETE",
                            "INSERT"
                        ],

                        correct: 1,

                        explanation:
                            "GROUP BY groups rows that share the same customer_id so aggregate functions can be applied to each group."
                    }

                ]
            },


            {
                title: "Joining Customer Data",

                prompt:
                    "You need a report containing customer names and their orders.",

                code: `
SELECT customers.name, orders.amount

                `,

                questions: [

                    {
                        question:
                            "What does the INNER JOIN do?",

                            "Combines matching rows from customers and orders",
                            "Deletes duplicate customers",
                            "Adds a new customer",
                            "Calculates the average order"
                        ],

                        correct: 0,

                        explanation:
                            "An INNER JOIN combines rows from two tables when their join keys match."

                    {
                        question:
                            "What column connects the two tables?",

                        options: [
                            "name",
                            "amount",
                            "customer_id",
                            "orders"

                        correct: 2,

                        explanation:
                            "The ON clause matches customers.customer_id with orders.customer_id."
                    },

                    {
                        question:
                            "What happens to a customer who has no matching order in an INNER JOIN?",

                            "The customer still appears",
                            "The customer does not appear",

                            "The database creates an order"

                        correct: 1,

                        explanation:
                            "INNER JOIN returns only rows that have matching values in both tables."
                    }

                ]
            },


            {
                title: "Cleaning a Dataset",

                    "You receive a customer dataset before creating a dashboard.",

Customer_ID | Age | State | Revenue

101 | 24 | UT | 500
102 |     | CA | 700
102 |     | CA | 700
103 | 31 | TX | 900

                `,

                questions: [

                    {
                        question:
                            "Which problem should you investigate first for customer 104?",

                        options: [
                            "Missing state",
                            "Duplicate ID",
                            "Potentially invalid age",
                            "Missing revenue"
                        ],

                        correct: 2,

                        explanation:
                            "An age of 250 is likely outside the valid range and should be investigated as a potential data-quality problem."
                    },

                    {
                        question:
                            "What issue appears with customer 102?",

                        options: [
                            "Duplicate record and missing age",
                            "Invalid state",
                            "Negative revenue",
                            "Missing customer ID"
                        ],

                        correct: 0,

                        explanation:
                            "Customer 102 appears twice and has a missing age value."
                    },

                    {
                        question:
                            "Before deleting the duplicate, what is the best next step?",

                        options: [
                            "Delete it immediately",
                            "Verify whether it truly represents the same transaction or record",
                            "Delete the entire dataset",
                            "Change the customer's state"
                        ],

                        correct: 1,

                        explanation:
                            "Analysts should understand why duplication occurred before removing records to avoid deleting legitimate information."
                    }

                ]
            }

        ]
    },

    // BUSINESS ANALYST
    // =====================================================

                        explanation:
                            "The initial request is vague. The analyst should clarify the business need, pain points, users, and desired outcomes before defining a solution."

                        question:

                            "What specific tasks are difficult or time-consuming today?",

                            "Understanding the specific pain points in the current workflow helps reveal the real business requirements."

                        question:
                            "Which statement is a requirement rather than a solution?",

            {
                title: "Process Improvement",

                prompt:
                    "Review the company's current employee expense reimbursement process.",

                code: `
1. Employee fills out a paper form.
2. Manager signs the paper form.

                `,

                questions: [

                    {
                        question:
                            "Which problem is most obvious in this process?",

                        options: [
                            "Too much automated data transfer",
                            "Multiple manual handoffs and duplicate data entry",
                            "Too few employees",
                            "Too much customer feedback"

                        correct: 1,

                        explanation:
                            "The process contains several manual handoffs and repeated entry of the same information, creating delay and error risk."

                    {
                        question:
                            "What would be a reasonable improvement?",

                            "Add another spreadsheet",

                            "Stop approving expenses"

                        correct: 1,

                        explanation:
                            "A digital workflow could capture data once and automate routing and approvals."
                    },

                    {
                        question:
                            "What metric would best help evaluate whether the change worked?",

                        options: [
                            "Average reimbursement processing time",
                            "Office temperature",
                            "Number of employee parking spaces",
                            "Website font size"
                        ],

                        correct: 0,

                        explanation:
                            "Processing time directly measures whether the redesigned process improved efficiency."
                    }

                ]
            },


            {
                title: "Conflicting Stakeholders",

                prompt:
                    "Two departments disagree about a new customer portal.",

                code: `
Sales:
Wants customers to create accounts as quickly as possible.

Security:
Wants additional identity verification before account creation.

Project deadline:
6 weeks.
                `,

                questions: [

                    {
                        question:
                            "What should the business analyst do?",

                        options: [
                            "Automatically choose Sales",
                            "Automatically choose Security",
                            "Clarify requirements, constraints, risks, and business priorities with both groups",
                            "Cancel the project"
                        ],

                        correct: 2,

                        explanation:
                            "A business analyst helps stakeholders understand needs and constraints and works toward requirements that support the overall business objective."
                    },

                    {
                        question:
                            "What type of issue is this primarily?",

                        options: [
                            "Conflicting stakeholder requirements",
                            "Database corruption",
                            "Employee payroll",
                            "Hardware failure"
                        ],

                        correct: 0,

                        explanation:
                            "Two stakeholder groups have competing requirements for the same process."
                    },

                    {
                        question:
                            "What should be documented after agreement is reached?",

                        options: [
                            "The final requirements and acceptance criteria",
                            "Only the meeting date",
                            "Employee vacation schedules",
                            "Nothing"
                        ],

                        correct: 0,

                        explanation:
                            "Clear requirements and acceptance criteria help ensure the project team understands what must be delivered."
                    }

                ]
            }

        ]
    },


    // =====================================================
    // SOFTWARE DEVELOPER
    // =====================================================

    softwareDeveloper: {

        title: "Software Developer",

        behavioral: [
            "Tell me about a software or coding project you are proud of.",
            "Tell me about a time you had to debug a difficult problem.",
            "Describe a time your code did not work as expected. How did you approach it?",
            "Tell me about a time you received feedback during a technical project.",
            "Describe a time you had to learn a new programming language, framework, or tool quickly.",
            "Tell me about a time you worked with another person on the same codebase."
        ],

        scenarios: [

            {
                title: "Python Debugging",

                prompt:
                    "A developer wants this function to return the largest number in a list.",

                code: `
def find_largest(numbers):
    largest = 0

    for number in numbers:
        if number > largest:
            largest = number

    return largest
                `,

                questions: [

                    {
                        question:
                            "For which input might this function return an incorrect answer?",

                        options: [
                            "[1, 2, 3]",
                            "[5, 8, 2]",
                            "[-10, -3, -7]",
                            "[0, 1, 2]"
                        ],

                        correct: 2,

                        explanation:
                            "If every number is negative, largest starts at 0 even though 0 is not in the list."
                    },

                    {
                        question:
                            "What is a better way to initialize largest when the list is known to contain at least one value?",

                        options: [
                            "largest = numbers[0]",
                            "largest = 100",
                            "largest = -1",
                            "largest = len(numbers)"
                        ],

                        correct: 0,

                        explanation:
                            "Starting with the first list value allows the function to correctly handle positive and negative numbers."
                    },

                    {
                        question:
                            "What is the purpose of the loop?",

                        options: [
                            "Compare each number with the current largest value",
                            "Sort the list",
                            "Delete negative numbers",
                            "Count the number of items"
                        ],

                        correct: 0,

                        explanation:
                            "The loop examines each value and updates largest when it finds a greater one."
                    }

                ]
            },


            {
                title: "List and Dictionary Logic",

                prompt:
                    "Review the code below.",

                code: `
students = {
    "Ana": 92,
    "Ben": 78,
    "Cara": 85
}

for name, score in students.items():
    if score >= 80:
        print(name)
                `,

                questions: [

                    {
                        question:
                            "Which names will be printed?",

                        options: [
                            "Ana only",
                            "Ana and Cara",
                            "Ben and Cara",
                            "All three students"
                        ],

                        correct: 1,

                        explanation:
                            "Ana has 92 and Cara has 85, so both satisfy score >= 80."
                    },

                    {
                        question:
                            "What does students.items() provide to the loop?",

                        options: [
                            "Only the scores",
                            "Only the names",
                            "Each key-value pair",
                            "The number of students"
                        ],

                        correct: 2,

                        explanation:
                            "items() returns the dictionary's key-value pairs, allowing name and score to be accessed together."
                    },

                    {
                        question:
                            "What change would print students with a score of exactly 80 or lower?",

                        options: [
                            "score <= 80",
                            "score == 100",
                            "score > 80",
                            "score != 80"
                        ],

                        correct: 0,

                        explanation:
                            "<= means less than or equal to."
                    }

                ]
            },


            {
                title: "Function Behavior",

                prompt:
                    "Review this function.",

                code: `

    result = []

    for item in items:
        if item not in result:
            result.append(item)

    return result
                `,

                questions: [

                    {
                        question:
                            "What will remove_duplicates([1, 2, 2, 3, 1]) return?",

                        options: [
                            "[1, 2, 3]",
                            "[1, 2, 2, 3, 1]",
                            "[2, 3]",
                            "[1]"
                        ],

                        correct: 0,

                        explanation:
                            "Items are only appended when they are not already in result."
                    },

                    {
                        question:
                            "What does 'item not in result' check?",

                        options: [
                            "Whether the value has already been added",
                            "Whether the value is numeric",
                            "Whether the list is empty",
                            "Whether the program has an error"
                        ],

                        correct: 0,

                        explanation:
                            "It tests whether the current value already exists in result."
                    },

                    {
                        question:
                            "Why does the function use a separate result list?",

                        options: [
                            "To build a collection containing only unique values",
                            "To alphabetize the input",
                            "To delete the original list",
                            "To convert numbers to strings"
                        ],

                        correct: 0,

                        explanation:
                            "The function builds a new list while only adding values that have not been seen."
                    }

                ]
            }

        ]
    },


    // =====================================================
    // CYBERSECURITY ANALYST
    // =====================================================

    cybersecurityAnalyst: {

        title: "Cybersecurity Analyst",

        behavioral: [
            "Tell me about a time you noticed a risk or problem that others had overlooked.",

                            "The employee should avoid interacting with the suspicious link and verify the request through a known legitimate channel."
                    },

                    {
                        question:
                            "Which control can reduce damage if a password is stolen?",

                            "Multi-factor authentication",

                        ],

            },


            {
                title: "Suspicious Login Activity",

                prompt:
                    "A monitoring system reports these login events.",

                code: `
08:05 - Successful login - Salt Lake City, Utah
08:08 - Successful login - Salt Lake City, Utah
08:15 - Successful login - Moscow, Russia
08:17 - Multiple failed login attempts - Moscow, Russia
                `,

                questions: [

                    {
                        question:
                            "What makes the Moscow login suspicious?",

                        options: [
                            "It happened in the morning",
                            "The geographic change occurred within only a few minutes",
                            "The account successfully logged in",

                        ],

                    {

                    },

                    {

                title: "Security Fundamentals",

                prompt:
                    "A hospital stores patient records in an information system.",

                code: `
Security goals:

1. Only authorized employees should view patient records.
2. Records should not be changed without authorization.

                `,

                questions: [

                    {
                        question:
                            "Goal 1 primarily represents which security principle?",

                        options: [
                            "Confidentiality",
                            "Integrity",
                            "Availability",

                        ],

                            "Availability means ensuring systems and information are accessible when authorized users need them."
                    }

                ]
            }

        ]
    },


    // =====================================================
    // PRODUCT MANAGER
    // =====================================================

    productManager: {

        title: "Product Manager",

        behavioral: [
            "Tell me about a time you had to prioritize competing needs.",
            "Tell me about a time you used data to make a decision.",
            "Describe a time you had to manage conflicting stakeholder priorities.",

// =====================================================
// VARIABLES
// =====================================================

let selectedRole;

let selectedBehavioralQuestions = [];

let selectedScenario;


// =====================================================
// RANDOM HELPER
// =====================================================

function randomItems(array, number) {

    const copy = [...array];

    copy.sort(() => Math.random() - 0.5);

    return copy.slice(0, number);
}


// =====================================================
// START INTERVIEW
// =====================================================

function startInterview(roleKey) {

    selectedRole =
        interviewBanks[roleKey];

    selectedBehavioralQuestions =
        randomItems(
            selectedRole.behavioral,
            3
        );

    selectedScenario =
        selectedRole.scenarios[
            Math.floor(
                Math.random() *
                selectedRole.scenarios.length
            )
        ];


    document.getElementById(
        "roleSelection"
    ).style.display = "none";


    document.getElementById(
        "resultsArea"
    ).style.display = "none";


    document.getElementById(
        "interviewArea"
    ).style.display = "block";


    document.getElementById(
        "roleTitle"
    ).textContent =
        selectedRole.title +
        " Mock Interview";


    displayBehavioralQuestions();

    displayTechnicalQuestions();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


// =====================================================
// BEHAVIORAL QUESTIONS
// =====================================================

function displayBehavioralQuestions() {

    const container =
        document.getElementById(
            "behavioralContainer"
        );


    let html = "";


    selectedBehavioralQuestions.forEach(
        (question, index) => {

            html += `
                <div class="question-box">

                    <h3>
                        Question ${index + 1}
                    </h3>

                    <p>
                        <strong>
                            ${question}
                        </strong>
                    </p>

                    <textarea
                        id="behavioralAnswer${index}"
                        placeholder="Type your answer here..."
                    ></textarea>

                </div>
            `;

        }
    );


    container.innerHTML =
        html;
}


// =====================================================
// ROLE-SPECIFIC QUESTIONS
// =====================================================

function displayTechnicalQuestions() {

    const container =
        document.getElementById(
            "technicalContainer"
        );


    let html = `

        <div class="question-box">

            <h3>
                ${selectedScenario.title}
            </h3>

            <p>
                ${selectedScenario.prompt}
            </p>

            <pre><code>${selectedScenario.code}</code></pre>

        </div>

    `;


    selectedScenario.questions.forEach(
        (question, questionIndex) => {

            html += `

                <div class="question-box">

                    <h3>
                        Question ${questionIndex + 4}
                    </h3>

                    <p>
                        <strong>
                            ${question.question}
                        </strong>
                    </p>

            `;


            question.options.forEach(
                (option, optionIndex) => {

                    html += `

                        <label>

                            <input
                                type="radio"
                                name="technicalQ${questionIndex}"
                                value="${optionIndex}"
                            >

                            ${String.fromCharCode(
                                65 + optionIndex
                            )}.

                            ${option}

                        </label>

                    `;

                }
            );


            html += `
                </div>
            `;

        }
    );


    container.innerHTML =
        html;
}


// =====================================================
// SUBMIT
// =====================================================

function submitInterview() {

    const behavioralAnswers =
        [];


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const answer =
            document.getElementById(
                "behavioralAnswer" + i
            ).value;


        if (
            answer.trim() === ""
        ) {

            showError(
                "Please answer all three behavioral questions."
            );

            return;
        }


        behavioralAnswers.push(
            answer
        );
    }


    for (
        let i = 0;
        i < 3;
        i++
    ) {

        const answer =
            document.querySelector(
                'input[name="technicalQ' +
                i +
                '"]:checked'
            );


        if (!answer) {

            showError(
                "Please answer all three role-specific questions."
            );

            return;
        }
    }


    buildResults(
        behavioralAnswers
    );
}


// =====================================================
// ERROR
// =====================================================

function showError(message) {

    document.getElementById(
        "errorMessage"
    ).innerHTML = `

        <div class="question-box">

            <strong>
                ${message}
            </strong>

        </div>

    `;
}


// =====================================================
// RESULTS
// =====================================================

function buildResults(
    behavioralAnswers
) {

    let score = 0;

    let technicalReviewHTML =
        "";


    selectedScenario.questions.forEach(
        (
            question,
            questionIndex
        ) => {

            const selectedAnswer =
                document.querySelector(
                    'input[name="technicalQ' +
                    questionIndex +
                    '"]:checked'
                );


            const selectedValue =
                Number(
                    selectedAnswer.value
                );


            if (
                selectedValue ===
                question.correct
            ) {

                score++;
            }


            let choicesHTML =
                "";


            question.options.forEach(
                (
                    option,
                    optionIndex
                ) => {

                    let answerClass =
                        "";

                    let answerLabel =
                        "";


                    if (
                        optionIndex ===
                        question.correct
                    ) {

                        answerClass =
                            "correct-answer";

                        answerLabel =
                            " ✓ Correct Answer";
                    }


                    if (
                        optionIndex ===
                        selectedValue &&
                        selectedValue !==
                        question.correct
                    ) {

                        answerClass =
                            "wrong-answer";
                    }


                    if (
                        optionIndex ===
                        selectedValue &&
                        selectedValue ===
                        question.correct
                    ) {

                        answerLabel =
                            " ✓ Your Answer — Correct";
                    }


                    choicesHTML += `

                        <p class="${answerClass}">

                            ${String.fromCharCode(
                                65 + optionIndex
                            )}.

                            ${option}

                            ${answerLabel}

                        </p>

                    `;

                }
            );


            technicalReviewHTML += `

                <div class="feedback-item">

                    <h3>
                        Question ${questionIndex + 4}
                    </h3>

                    <p>
                        <strong>
                            ${question.question}
                        </strong>
                    </p>

                    ${choicesHTML}

                    <p>
                        <strong>
                            Explanation:
                        </strong>

                        ${question.explanation}
                    </p>

                </div>

            `;

        }
    );


    let behavioralReviewHTML =
        "";


    selectedBehavioralQuestions.forEach(
        (
            question,
            index
        ) => {

            behavioralReviewHTML += `

                <div class="feedback-item">

                    <h3>
                        Question ${index + 1}
                    </h3>

                    <p>
                        <strong>
                            ${question}
                        </strong>
                    </p>

                    <p>
                        <strong>
                            Your Response:
                        </strong>
                    </p>

                    <div class="user-response">

                        ${behavioralAnswers[index]}

                    </div>

                    <div class="feedback-placeholder">

                        <strong>
                            Behavioral Feedback:
                        </strong>

                        <p>
                            Feedback will appear here.
                        </p>

                    </div>

                </div>

            `;

        }
    );


    const percentage =
        Math.round(
            score / 3 * 100
        );


    document.getElementById(
        "interviewArea"
    ).style.display =
        "none";


    document.getElementById(
        "resultsArea"
    ).style.display =
        "block";


    document.getElementById(
        "resultsArea"
    ).innerHTML = `

        <h1>
            ${selectedRole.title}
            Interview Review
        </h1>


        <div class="results-section">

            <h2>
                Part 1 —
                Behavioral Review
            </h2>

            ${behavioralReviewHTML}

        </div>


        <div class="results-section">

            <h2>
                Part 2 —
                Role-Specific Review
            </h2>


            <h3>
                Score:
                ${score}/3
                (${percentage}%)
            </h3>


            <h3>
                ${selectedScenario.title}
            </h3>


            <p>
                ${selectedScenario.prompt}
            </p>


            <pre><code>${selectedScenario.code}</code></pre>


            ${technicalReviewHTML}

        </div>


        <button
            class="restart-button"
            onclick="chooseAnotherRole()">

            Choose Another Role

        </button>

    `;


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}

    document.getElementById(

    document.getElementById(

    document.getElementById(
        "errorMessage"

        behavior: "smooth"

}
